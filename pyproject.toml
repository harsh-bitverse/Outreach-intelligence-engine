[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "outreach-intelligence-engine"
version = "0.1.0"
description = "Production-grade research outreach intelligence engine for Summer 2027 international internships"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Harshith N", email = "ch1251635@iitd.ac.in" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "openpyxl>=3.1.2",
    "requests>=2.31.0",
    "python-multipart>=0.0.9",
    "tzdata>=2024.1",
    "keyring>=25.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
addopts = "-v --strict-markers -p no:anyio"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 110
src = ["src", "tests", "config", "scripts"]
